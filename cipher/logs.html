<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIPHER Activity Log</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="site-header">
    <div class="container row">
        <div class="header-left">
            <a class="brand" href="index.html">CIPHER</a>
            <nav class="site-nav">
                <a href="missions.html">Missions</a>
                <a href="blackmarket.html">Black Market</a>
                <a data-admin href="dashboard.html">Dashboard</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a data-admin href="agents.html">Agents</a>
                <a class="active" href="logs.html">Log</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
        <div class="mono muted">
            AGENT <span id="navAgent">-</span>
            <a href="login.html?logout=1" class="nav-logout">Log out</a>
        </div>
    </div>
</header>

<h1>Activity Log</h1>
<p class="info">Your recent activity.</p>

<input type="text" id="search" placeholder="Search activity...">

<select id="event">
    <option value="All">All Events</option>
    <option value="Login">Login</option>
    <option value="Logout">Logout</option>
    <option value="Mission Solved">Mission Solved</option>
    <option value="Mission Failed">Mission Failed</option>
    <option value="Bounty Posted">Bounty Posted</option>
    <option value="Bounty Claimed">Bounty Claimed</option>
    <option value="Shop Purchase">Shop Purchase</option>
    <option value="Profile Updated">Profile Updated</option>
    <option value="Password Updated">Password Updated</option>
</select>

<button id="clearFilter">Clear Filter</button>

<table id="logs">
    <thead>
        <tr>
            <th>Time</th>
            <th>Agent</th>
            <th>Event</th>
            <th>Details</th>
            <th>XP</th>
            <th>Coins</th>
        </tr>
    </thead>
    <tbody id="logRows"></tbody>
</table>

<footer class="site-footer">
  <div class="container row">
    <div><strong>CIPHER</strong> Academic Challenge Platform</div>
    <nav class="footer-links"><a href="#">About</a><a href="#">Format Standards</a><a href="#">Rules</a></nav>
  </div>
</footer>
<script src="js/data.js"></script>
<script src="js/logs.js"></script>

</body>
</html>
