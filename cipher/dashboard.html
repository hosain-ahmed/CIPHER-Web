<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIPHER Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body data-admin-page>

<header class="site-header">
    <div class="container row">
        <div class="header-left">
            <a class="brand" href="index.html">CIPHER</a>
            <nav class="site-nav">
                <a href="missions.html">Missions</a>
                <a href="blackmarket.html">Black Market</a>
                <a class="active" data-admin href="dashboard.html">Dashboard</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a data-admin href="agents.html">Agents</a>
                <a href="logs.html">Log</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
        <div class="mono muted">
            AGENT <span id="navAgent">-</span>
            <a href="login.html?logout=1" class="nav-logout">Log out</a>
        </div>
    </div>
</header>

<main class="container page">
    <h1>Dashboard</h1>

    <section class="columns section">
        <div class="info-card">
            <div class="mono muted small">TOTAL AGENTS</div>
            <h3 id="totalAgents">0</h3>
        </div>

        <div class="info-card">
            <div class="mono muted small">TOTAL MISSIONS</div>
            <h3 id="totalMissions">0</h3>
        </div>

        <div class="info-card">
            <div class="mono muted small">MISSIONS SOLVED TODAY</div>
            <h3 id="solvedToday">0</h3>
        </div>
    </section>

    <h2 class="section">Recent Activity</h2>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Agent</th>
                    <th>Activity</th>
                </tr>
            </thead>
            <tbody id="recentActivity"></tbody>
        </table>
    </div>

    <h2 class="section">Top Agents</h2>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Agent</th>
                    <th>XP</th>
                </tr>
            </thead>
            <tbody id="topAgents"></tbody>
        </table>
    </div>
</main>

<footer class="site-footer">
  <div class="container row">
    <div><strong>CIPHER</strong> Academic Challenge Platform</div>
    <nav class="footer-links"><a href="#">About</a><a href="#">Format Standards</a><a href="#">Rules</a></nav>
  </div>
</footer>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
