<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIPHER Leaderboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body>

<header class="site-header">
    <div class="container row">
        <div class="header-left">
            <a class="brand" href="index.html">CIPHER</a>
            <nav class="site-nav">
                <a href="missions.html">Missions</a>
                <a href="blackmarket.html">Black Market</a>
                <a data-admin href="dashboard.html">Dashboard</a>
                <a class="active" href="leaderboard.html">Leaderboard</a>
                <a data-admin href="agents.html">Agents</a>
                <a href="logs.html">Log</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
        <div class="mono muted">
            AGENT <span id="navAgent">-</span>
            <a href="login.html?logout=1" class="nav-logout">Log out</a>
        </div>
    </div>
</header>

<main class="container page">
    <h1>Leaderboard</h1>
    <p class="muted">Agent rankings based on total XP earned.</p>

    <section class="columns section">
        <div class="info-card">
            <div class="mono muted small">TOTAL AGENTS</div>
            <h3 id="leaderboardAgentCount">0</h3>
        </div>

        <div class="info-card">
            <div class="mono muted small">MINIMUM XP</div>
            <h3 id="leaderboardMinXp">0 XP</h3>
        </div>
    </section>

    <div class="filters section">
        <input class="form-control search-field" type="text" id="search"
               placeholder="Search agent..."
               onkeyup="searchAgent()">
    </div>

    <div class="table-wrap section">
        <table class="data-table" id="leaderboard">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Agent</th>
                    <th>Tier</th>
                    <th>Total XP</th>
                    <th>Missions</th>
                </tr>
            </thead>
            <tbody id="leaderboardRows"></tbody>
        </table>
    </div>
</main>

<footer class="site-footer">
  <div class="container row">
    <div><strong>CIPHER</strong> Academic Challenge Platform</div>
    <nav class="footer-links"><a href="#">About</a><a href="#">Format Standards</a><a href="#">Rules</a></nav>
  </div>
</footer>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
