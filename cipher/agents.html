<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIPHER Agents</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body data-admin-page>

<header class="site-header">
    <div class="container row">
        <div class="header-left">
            <a class="brand" href="index.html">CIPHER</a>
            <nav class="site-nav">
                <a href="missions.html">Missions</a>
                <a href="blackmarket.html">Black Market</a>
                <a data-admin href="dashboard.html">Dashboard</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a class="active" data-admin href="agents.html">Agents</a>
                <a href="logs.html">Log</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
        <div class="mono muted">
            AGENT <span id="navAgent">-</span>
            <a href="login.html?logout=1" class="nav-logout">Log out</a>
        </div>
    </div>
</header>

<main class="container page">
    <h1>Agents</h1>

    <section class="filters section">
        <button class="btn btn-primary" onclick="addUser()">+ Add User</button>
        <input class="form-control search-field" type="text" id="search"
               placeholder="Search codename..."
               onkeyup="searchUser()">
        <select class="form-control" id="role" onchange="filterRole()">
            <option value="All">All Roles</option>
            <option value="Agent">Agent</option>
            <option value="Admin">Admin</option>
        </select>
    </section>

    <div class="table-wrap section">
        <table class="data-table" id="agents">
            <thead>
                <tr>
                    <th>Codename</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="agentRows"></tbody>
        </table>
    </div>
</main>

<footer class="site-footer">
  <div class="container row">
    <div><strong>CIPHER</strong> Academic Challenge Platform</div>
    <nav class="footer-links"><a href="#">About</a><a href="#">Format Standards</a><a href="#">Rules</a></nav>
  </div>
</footer>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
