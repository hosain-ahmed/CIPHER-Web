<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPHER Agent Sign In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      width: 400px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .card-header {
      background: #eef2ff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .card-body {
      padding: 20px;
    }

    .alert {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 15px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 10px;
      top: 5px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .input-box {
      position: relative;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .eye-icon {
      position: absolute;
      right: 10px;
      top: 8px;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .info-box {
      background: #f0fdf4;
      color: #166534;
      padding: 10px;
      font-size: 12px;
      margin-top: 15px;
      border-radius: 4px;
    }

    .card-footer {
      background: #eef2ff;
      padding: 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <div class="card-header">
      <span>CIPHER v4.2.0</span>
      <small>AGENT AUTHENTICATION</small>
    </div>

    <div class="card-body">
      <h2>Agent Sign In</h2>
      <p style="font-size: 12px; color: #555;">Enter credentials to access missions.</p>

      <div class="alert" id="errorBox">
        <span class="close-btn" onclick="hideAlert()">×</span>
        <strong>Authentication failed</strong><br>
        Codename or password does not match.
      </div>

      <form onsubmit="submitForm(event)">
        
        <div class="form-group">
          <label><span>CODENAME</span><small>ASCII_ID</small></label>
          <input type="text" value="zero_trace" required>
        </div>

        <div class="form-group">
          <label><span>PASSWORD</span><small>SHA256</small></label>
          <div class="input-box">
            <input type="password" id="passInput" value="123456" required>
            <span class="eye-icon" onclick="togglePass()">👁</span>
          </div>
        </div>

        <div class="options">
          <label><input type="checkbox" checked> Remember workstation</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Log In to CIPHER</button>
      </form>

      <div class="info-box">
        ℹ Administrative personnel use standard credentials.
      </div>
    </div>

    <div class="card-footer">
      <span>New? <a href="#">Register</a></span>
      <span>RULES • STATUS</span>
    </div>

  </div>

  <script>
    function togglePass() {
      var passInput = document.getElementById("passInput");
      if (passInput.type === "password") {
        passInput.type = "text";
      } else {
        passInput.type = "password";
      }
    }

    function hideAlert() {
      document.getElementById("errorBox").style.display = "none";
    }

    function submitForm(event) {
      event.preventDefault();
      alert("Form Submitted!");
    }
  </script>

</body>
</html>
